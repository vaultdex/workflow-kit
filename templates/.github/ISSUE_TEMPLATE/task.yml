name: Aufgabe
description: Zweck, Nutzen, konkrete Umsetzung und überprüfbares Ergebnis.
body:
  - type: textarea
    id: human-input
    attributes:
      label: Menschliche Mitwirkung nötig
      description: Nur bei nötiger menschlicher Entscheidung oder Handlung ausfüllen und needs-human-input setzen. Sonst leer lassen und leeren Abschnitt vor Übergabe entfernen.
      placeholder: "Wer? Konkrete Frage/Handlung, Optionen und Empfehlung? Was blockiert, was bleibt möglich? Antwort hier oder im Agent-Chat; danach hält der Agent Entscheidung und Herkunft im Issue fest."
    validations:
      required: false
  - type: textarea
    id: purpose
    attributes:
      label: Wofür brauchen wir das?
      description: Welches belegte Problem hat welcher Nutzer oder Ablauf? Bei Fehlern Reproduktion und erwartetes Verhalten nennen.
    validations:
      required: true
  - type: textarea
    id: benefit
    attributes:
      label: Was bringt es uns?
      description: Konkreter Vorteil oder vermiedener Schaden, ohne unbelegte Zeit- oder Kostenversprechen.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Was muss gemacht werden?
      description: Vollständiges Ergebnis und klare Grenzen. Was gehört ausdrücklich nicht dazu?
    validations:
      required: true
  - type: textarea
    id: implementation
    attributes:
      label: Wie soll es umgesetzt werden?
      description: Geordnete Schritte mit Dateien, Symbolen, Verträgen und vorhandenen Bausteinen. Betroffene Rechte, Daten, Fehler und Wiederholung erklären. Offene Entscheidungen als Frage mit Empfehlung kennzeichnen.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Woran erkennen wir, dass es fertig ist?
      description: Prüffähige Kriterien, passender Test/Befehl oder genauer Prüfweg und erwartetes Ergebnis. Grenzen von Mocks und Live-Nachweisen nennen.
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Abhängigkeiten und Wiederaufnahme
      description: Voraussetzungen mit Beleg, nächster Aktion und Zuständigkeit; sonst „keine bekannt“. Kommentarfragen im Haupttext klären und Quellen verlinken. Status und Priority bleiben im Project.
    validations:
      required: true
