name: Renovate regenerate
# Renovate only moves a submodule pin. Port the Ponytail adaptations, regenerate the committed
# skills, push the result to the Renovate branch and start the repository CI for it.
on:
  pull_request:
    branches: [main]
    paths:
      - .gitmodules
      - .vendor/**
permissions: {}
concurrency:
  group: renovate-regenerate-${{ github.head_ref }}
  # A cancelled run could stop between push and CI dispatch.
  cancel-in-progress: false
jobs:
  regenerate:
    name: Regenerate Renovate outputs
    # The sender is the authenticated pusher; commit author names are self-reported and prove nothing.
    if: >-
      github.event.pull_request.user.login == 'renovate[bot]' && github.event.sender.login == 'renovate[bot]'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      # contents: push the regenerated outputs. actions: pushes with GITHUB_TOKEN start no workflows,
      # so the repository CI is dispatched on the new head instead.
      contents: write
      actions: write
    env:
      BRANCH: ${{ github.event.pull_request.head.ref }}
    steps:
      # The commit Renovate's authenticated event named, not the branch name: a push by someone else in
      # between makes the final push fail instead of running that commit. No stored credentials either;
      # only the last two steps get the token.
      - uses: actions/checkout@v7.0.1
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: main
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      # Policy: a branch with commits by someone else is theirs; leave it alone. Commit author names are
      # self-reported, so this is no security boundary: the job runs only the scripts of main (next step).
      - name: Check who changed the branch
        run: |
          set -euo pipefail
          authors=$(git log --format='%an' origin/main..HEAD | sort -u)
          if [ -n "$(printf '%s\n' "$authors" | grep -v -x -e 'renovate\[bot\]' -e 'github-actions\[bot\]' || true)" ]; then
            echo "::notice::Commits by someone else on this branch; regenerate by hand: node scripts/update-ponytail.mjs"
            echo "SKIP=true" >> "$GITHUB_ENV"
            exit 0
          fi
          # Whoever wrote the commits: nothing the job runs or dispatches may differ from main. That is every
          # workflow, script and the Renovate config; the three files the updaters generate are data.
          forbidden=$(git diff --name-only origin/main...HEAD | grep -E '^(\.github/workflows/|renovate\.json|\.node-version|scripts/)' \
            | grep -v -x -e 'scripts/ponytail/adaptations.patch' -e 'scripts/impeccable/VERSION' -e 'scripts/impeccable/SHA256SUMS' || true)
          if [ -n "$forbidden" ]; then
            echo "::error::The branch changes workflows, scripts or Renovate config; not running with write access: $forbidden"
            exit 1
          fi
      # Whatever the branch changed under scripts/ never runs here: main's scripts replace it, and only the
      # branch's adaptation patch (input data for the Ponytail port) is kept.
      - name: Run only the scripts of main
        if: env.SKIP != 'true'
        run: |
          set -euo pipefail
          cp scripts/ponytail/adaptations.patch "$RUNNER_TEMP/branch-adaptations.patch"
          git archive origin/main scripts .node-version | tar -x
          cp "$RUNNER_TEMP/branch-adaptations.patch" scripts/ponytail/adaptations.patch
      - uses: actions/setup-node@v7.0.0
        if: env.SKIP != 'true'
        with:
          node-version-file: .node-version
          package-manager-cache: false
      # Submodules are fetched only once their sources proved to be main's (main's checker, see above): a commit that
      # points .gitmodules at another repository would otherwise ship that repository's files as generated hooks.
      - name: Fetch the submodules
        if: env.SKIP != 'true'
        run: |
          set -euo pipefail
          git show origin/main:.gitmodules > "$RUNNER_TEMP/main.gitmodules"
          node scripts/check-submodule-sources.mjs "$RUNNER_TEMP/main.gitmodules"
          git submodule update --init --recursive
      - name: Regenerate
        if: env.SKIP != 'true'
        run: |
          set -euo pipefail
          changed=$(git diff --name-only origin/main...HEAD)
          # Ponytail first: the other generators fail on a stale adaptation patch.
          if grep -qx '.vendor/ponytail' <<<"$changed"; then node scripts/update-ponytail.mjs; fi
          if grep -qx '.vendor/impeccable' <<<"$changed"; then node scripts/update-impeccable.mjs; fi
          node scripts/init-project.mjs --existing
          node scripts/setup-skills.mjs
      - name: Commit and push
        if: env.SKIP != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Generated outputs and the three generated files under scripts/ only; main's scripts stay out.
          git add --all -- . ':(exclude)scripts' ':(exclude).node-version'
          git add -- scripts/ponytail/adaptations.patch scripts/impeccable/VERSION scripts/impeccable/SHA256SUMS
          if git diff --cached --quiet HEAD; then
            echo "Committed outputs are already current."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -q -m 'chore(skills): Ausgaben nach Submodul-Update regenerieren' -m 'Erzeugt vom Workflow Renovate regenerate (#93).'
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin "HEAD:refs/heads/$BRANCH"
      # A run on the head that is still going or has a verdict (success or failure), whatever its event,
      # is enough; cancelled or skipped runs are not. Dispatch retries briefly; if it still fails, the job
      # fails visibly and someone starts repository.yml for the branch by hand (a re-run would only repeat
      # the original event SHA).
      - name: Start the repository CI
        if: env.SKIP != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          head=$(git rev-parse HEAD)
          runs=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow repository.yml --commit "$head" --json status,conclusion \
            --jq '[.[] | select(.status != "completed" or .conclusion == "success" or .conclusion == "failure")] | length')
          if [ "$runs" = 0 ]; then
            # workflow_dispatch takes a branch, not a commit, and runs that branch's workflow definition. Start it
            # only while the branch still is the commit validated above, and stop any run it started for another one.
            [ "$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)" = "$head" ] \
              || { echo "::error::The branch moved after the push; not dispatching a workflow nobody validated."; exit 1; }
            for attempt in 1 2 3; do
              gh workflow run repository.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH" && break
              [ "$attempt" = 3 ] && exit 1
              sleep 10
            done
            sleep 15
            for id in $(HEAD_NOW="$head" gh run list --repo "$GITHUB_REPOSITORY" --workflow repository.yml --branch "$BRANCH" --event workflow_dispatch --limit 5 \
              --json databaseId,headSha,status --jq '.[] | select(.status != "completed" and .headSha != env.HEAD_NOW) | .databaseId'); do
              gh run cancel "$id" --repo "$GITHUB_REPOSITORY"
              echo "::error::A dispatched run belonged to another commit and was cancelled."
              exit 1
            done
          else
            echo "The repository CI already runs for $head."
          fi
