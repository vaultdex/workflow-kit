name: Workflow Kit
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: workflow-kit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Workflow Kit checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        env:
          # Configure only checkout's Git processes; the requested ref still selects HEAD.
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: main
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: node scripts/check-skills.mjs
      - run: node scripts/init-project.mjs . --existing --check
      - run: node scripts/setup-skills.mjs
      - run: node --test scripts/tests
      - run: git diff --exit-code -- .github .codex .claude .cursor
